name: Apple Silicon model feedback
description: Attach a Breeze hardware diagnostic report for an Apple Silicon Mac.
title: "[Hardware]: "
labels: ["hardware", "monitor-only"]
body:
  - type: markdown
    attributes:
      value: |
        In Breeze, open **Settings → Hardware → Export Diagnostic Report…**, then attach the generated JSON below.

        A report does not enable fan writes. Never bypass the model whitelist or test arbitrary SMC writes. The exporter excludes serial numbers, usernames, paths, logs, passwords, certificates, and signing identities by design.
  - type: input
    id: model
    attributes:
      label: Exact model identifier
      placeholder: "MacBookPro18,3"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip and fan count
      placeholder: "Apple M1 Pro, 2 fans"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: Breeze diagnostic report
      description: Drag the exported Breeze-Hardware-*.json file here. If GitHub refuses JSON attachments, place it in a ZIP file first.
      placeholder: Drag the exported report here. Do not paste unrelated system logs.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What works or looks wrong?
      description: Describe missing sensors, implausible readings, fan count/range differences, or other monitor-only behavior. Do not test fan writes.
  - type: checkboxes
    id: restrictions
    attributes:
      label: Confirmation
      options:
        - label: I did not modify the whitelist, issue fan writes, or disable Breeze safety checks.
          required: true
        - label: I reviewed the attachment and it contains no serial numbers, usernames, credentials, or unrelated personal data.
          required: true
